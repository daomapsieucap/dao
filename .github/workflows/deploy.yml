name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ master ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:
  # Rebuild monthly so Goodreads shelf data stays fresh even without a code push
  schedule:
    - cron: '0 17 1 * *' # 00:00 ICT on the 1st of each month

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          # path: . # The root location of your Astro project inside the repository. (optional)
          node-version: 22.23.2 # matches the local dev Node version; astro's font tooling (unifont/undici) requires >=22.19.0
        # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)
        env:
          GOODREADS_USER_ID: ${{ secrets.GOODREADS_USER_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ fromJSON(steps.deployment.outputs.outputs).page_url }}
    steps:
#      - name: Upload artifact
#        uses: actions/upload-artifact@v4
#        with:
#          path: './dao'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/deploy-pages@v5
          attempt_limit: 3
          attempt_delay: 15000